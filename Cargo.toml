[package]
name = "kintoun"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Morten Voss <morten@airwallet.net>"]
description = "Distributed key-value store in Rust. Early development — not yet usable. Built as a Rust learning project toward streams, queues, and clustering."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mauv0809/kintoun"
readme = "README.md"
keywords = ["kv", "key-value", "database", "storage", "learning"]
categories = ["database-implementations", "data-structures"]
exclude = [
    ".claude/",
    ".github/",
    ".mcp.json",
    "Daily Notes/",
    "Scratchpad.md",
    "Task Board.md",
    "CLAUDE.md",
    "CLAUDE.local.md",
    "SETUP.md",
]

[dependencies]
thiserror = "2"
anyhow = "1"

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"
